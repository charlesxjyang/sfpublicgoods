<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="wrinkle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" seed="3" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.18  0 0 0 0.7 0" result="tint"/>
      <feComposite in="tint" in2="SourceGraphic" operator="in" result="masked"/>
      <feBlend in="SourceGraphic" in2="masked" mode="multiply"/>
    </filter>
  </defs>
  <rect width="32" height="32" fill="#f0e5c5" filter="url(#wrinkle)"/>
  <text x="16" y="22" font-family="'Courier New', Courier, monospace" font-size="18" font-weight="700" text-anchor="middle" fill="#3d2817">SF</text>
</svg>
